
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EngageX — Admin Portal</title>
<style>
  :root{
    --bg:#F5F6FB; --panel:#FFFFFF; --panel-2:#FAFAFE; --line:#E8E9F3;
    --purple:#6D5BD0; --purple-bg:#EFECFC; --purple-dark:#5443B8;
    --orange:#F0A93E; --orange-bg:#FEF3DF;
    --green:#33AE73; --green-bg:#E6F8EE;
    --red:#E5584D; --red-bg:#FCEAE9;
    --text:#22203A; --text-dim:#8D8AA3; --radius:12px;
    --shadow:0 1px 2px rgba(30,27,60,0.04), 0 4px 14px rgba(30,27,60,0.05);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; padding:20px; min-height:100vh;}
  .wrap{max-width:640px; margin:0 auto;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow);}

  /* ---- login ---- */
  #loginView{display:flex; align-items:center; justify-content:center; min-height:80vh;}
  #loginView .card{width:100%; max-width:360px;}
  .brand-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .brand-row span{width:20px;height:20px;border-radius:6px;background:var(--purple);display:inline-block;}
  .brand-row b{color:var(--purple-dark); font-size:15px;}
  h1{font-size:20px; font-weight:700; margin-top:14px;}
  .sub{color:var(--text-dim); font-size:12.5px; margin-top:4px; margin-bottom:18px;}
  .form-row{margin-bottom:14px;}
  .form-row label{display:block; font-size:12px; font-weight:600; margin-bottom:5px;}
  .form-row input, .form-row select{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--panel-2); color:var(--text);}
  .form-row input:focus, .form-row select:focus{outline:none; border-color:var(--purple);}
  .btn-primary{width:100%; background:var(--purple); border:none; color:#fff; padding:11px 16px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;}
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}
  .btn-secondary{background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .btn-secondary:disabled{opacity:.6; cursor:not-allowed;}
  .form-error{font-size:12.5px; color:var(--red); margin-top:10px; display:none;}

  /* ---- dashboard ---- */
  #dashView{display:none;}
  .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .hello{font-size:19px; font-weight:700;}
  .hello span{color:var(--purple-dark);}

  .earn-card{background:linear-gradient(135deg, var(--purple), var(--purple-dark)); color:#fff; border-radius:var(--radius); padding:18px 20px; margin-bottom:20px;}
  .earn-card .label{font-size:12px; opacity:.85; font-weight:600;}
  .earn-card .value{font-size:28px; font-weight:800; margin-top:4px;}
  .earn-card .note{font-size:11px; opacity:.75; margin-top:6px;}

  .task-card{margin-bottom:14px;}
  .task-name{font-size:15px; font-weight:700; margin-bottom:2px;}
  .task-meta{font-size:12px; color:var(--text-dim); margin-bottom:12px;}
  .progress-outer{height:6px; background:#EDEDF5; border-radius:4px; overflow:hidden; margin-bottom:14px;}
  .progress-inner{height:100%; background:var(--purple); border-radius:4px;}
  .task-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:end;}
  .task-actions{display:flex; gap:10px; margin-top:12px;}
  .task-actions .btn-primary{flex:1;}
  .status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-block;}
  .status-pill.done{background:var(--green-bg); color:#1F8C57;}
  .status-pill.progress{background:var(--orange-bg); color:#B8790E;}
  .status-pill.notstarted{background:#F0F0F6; color:var(--text-dim);}
  .earn-row{display:flex; gap:14px; flex-wrap:wrap; margin:12px 0 4px; padding:10px 12px; background:var(--purple-bg); border-radius:8px;}
  .earn-item{font-size:11.5px;}
  .earn-item b{display:block; font-size:14px; color:var(--purple-dark); font-weight:800;}
  .save-msg{font-size:11.5px; margin-top:8px; display:none;}
  .save-msg.ok{color:var(--green);}
  .save-msg.err{color:var(--red);}
  .empty-note{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 0;}
  .refresh-row{text-align:center; margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ LOGIN ============ -->
  <div id="loginView">
    <div class="card">
      <div class="brand-row"><span></span><b>EngageX</b></div>
      <h1>Admin Portal</h1>
      <div class="sub">Log in with the ID and password you were given.</div>

      <div class="form-row">
        <label>Admin ID</label>
        <input type="text" id="f_adminId" placeholder="e.g. 1" inputmode="numeric">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" id="f_password" placeholder="Password">
      </div>

      <button class="btn-primary" id="loginBtn">Log In</button>
      <div class="form-error" id="loginError"></div>
    </div>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div id="dashView">
    <div class="top-row">
      <div class="hello">Hi, <span id="adminNameLabel"></span></div>
      <button class="btn-secondary" id="logoutBtn">Log out</button>
    </div>

    <div class="earn-card">
      <div class="label">Total received so far</div>
      <div class="value" id="totalReceived">₹0</div>
      <div class="note">Paid out whenever a client of yours is fully settled.</div>
    </div>

    <div id="taskList"></div>
    <div class="refresh-row"><button class="btn-secondary" id="refreshBtn">Refresh</button></div>
  </div>

</div>

<script>
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwUL66O_GqQOhdc_VBeEV-P8bppPMv-l1Zdw0-lC994VlLPBFHRG9AZhQqX2ZmduB0t/exec";

let session = null; // { adminId, password, adminName }
let isLoading = false;

function fmt(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
function statusClass(status){
  const s = (status||"").toLowerCase();
  if(s==="done") return "done";
  if(s==="in progress") return "progress";
  return "notstarted";
}
// Defense-in-depth: escape any sheet-sourced text before it goes into innerHTML.
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

/* ---- session persistence (this is a real hosted page, not a preview,
   so localStorage is fine here — see note in project docs about moving
   to a token-based session later) ---- */
function saveSession(s){ localStorage.setItem('engagex_admin_session', JSON.stringify(s)); }
function loadSession(){ try{ return JSON.parse(localStorage.getItem('engagex_admin_session')); }catch(e){ return null; } }
function clearSession(){ localStorage.removeItem('engagex_admin_session'); }

async function login(adminId, password){
  const res = await fetch(GAS_WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'adminLogin', payload: { adminId, password } })
  });
  return res.json();
}

// Changed from GET with password in the query string to POST with the
// password in the body — query params can end up in server logs and
// Referer headers, request bodies don't.
async function fetchAdminData(){
  const res = await fetch(GAS_WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'getAdminData',
      payload: { adminId: session.adminId, password: session.password }
    })
  });
  return res.json();
}

async function updateProgress(profileName, status, currentlyIncreased){
  const res = await fetch(GAS_WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'updateBookingProgress',
      payload: { adminId: session.adminId, password: session.password, profileName, status, currentlyIncreased }
    })
  });
  return res.json();
}

function showLogin(){
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('dashView').style.display = 'none';
}
function showDash(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashView').style.display = 'block';
}

async function doLogin(){
  const adminId = document.getElementById('f_adminId').value.trim();
  const password = document.getElementById('f_password').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  if(!adminId || !password){
    errEl.textContent = 'Enter both Admin ID and password.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  try{
    const result = await login(adminId, password);
    if(!result.success) throw new Error(result.error || 'Login failed');
    session = { adminId: result.adminId, password, adminName: result.adminName };
    saveSession(session);
    await loadDashboard();
  }catch(err){
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'Log In';
  }
}

document.getElementById('loginBtn').onclick = doLogin;
// Enter key now submits from either field, not just a click.
['f_adminId','f_password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if(e.key === 'Enter') doLogin();
  });
});

document.getElementById('logoutBtn').onclick = () => {
  clearSession();
  session = null;
  showLogin();
};

document.getElementById('refreshBtn').onclick = () => {
  if(isLoading) return;
  loadDashboard();
};

function renderTasks(tasks){
  const list = document.getElementById('taskList');
  if(!tasks.length){
    list.innerHTML = '<div class="empty-note">No profiles assigned to you yet.</div>';
    return;
  }
  list.innerHTML = tasks.map((t) => {
    const pct = t.order ? Math.min(100, Math.round((t.currentlyIncreased / t.order) * 100)) : 0;
    const safeName = escapeHtml(t.profileName);
    return `<div class="card task-card" data-name="${safeName}" data-order="${Number(t.order)||0}">
      <div class="task-name">${safeName}</div>
      <div class="task-meta">${Number(t.currentlyIncreased)||0}/${Number(t.order)||0} done · ${escapeHtml(t.dailyQty)}/day pace · <span class="status-pill ${statusClass(t.status)}">${escapeHtml(t.status)}</span></div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%;"></div></div>
      <div class="earn-row">
        <div class="earn-item">You earn on completion<b>${fmt(t.adminEarning)}</b></div>
      </div>
      <div class="task-grid">
        <div class="form-row" style="margin-bottom:0;">
          <label>Status</label>
          <select class="f_status">
            <option value="Not started" ${t.status==='Not started'?'selected':''}>Not started</option>
            <option value="In progress" ${t.status==='In progress'?'selected':''}>In progress</option>
            <option value="Done" ${t.status==='Done'?'selected':''}>Done</option>
          </select>
        </div>
        <div class="form-row" style="margin-bottom:0;">
          <label>Currently increased</label>
          <input type="number" class="f_increased" min="0" value="${Number(t.currentlyIncreased)||0}">
        </div>
      </div>
      <div class="task-actions">
        <button class="btn-primary f_save">Save update</button>
      </div>
      <div class="save-msg"></div>
    </div>`;
  }).join('');

  list.querySelectorAll('.task-card').forEach(card => {
    card.querySelector('.f_save').addEventListener('click', async () => {
      const name = card.dataset.name;
      const order = Number(card.dataset.order) || 0;
      const status = card.querySelector('.f_status').value;
      const increasedInput = card.querySelector('.f_increased');
      let increased = Number(increasedInput.value);
      const msgEl = card.querySelector('.save-msg');
      const btn = card.querySelector('.f_save');

      if(Number.isNaN(increased) || increased < 0){
        msgEl.textContent = 'Enter a valid number.';
        msgEl.className = 'save-msg err';
        msgEl.style.display = 'block';
        return;
      }
      // Guard against entering more than the order total by mistake.
      if(order > 0 && increased > order){
        msgEl.textContent = `Can't exceed the order total (${order}).`;
        msgEl.className = 'save-msg err';
        msgEl.style.display = 'block';
        return;
      }

      btn.disabled = true; btn.textContent = 'Saving…';
      msgEl.style.display = 'none';
      try{
        const result = await updateProgress(name, status, increased);
        if(!result.success) throw new Error(result.error || 'Could not save');
        msgEl.textContent = 'Saved.';
        msgEl.className = 'save-msg ok';
        msgEl.style.display = 'block';
      }catch(err){
        msgEl.textContent = err.message;
        msgEl.className = 'save-msg err';
        msgEl.style.display = 'block';
      }finally{
        btn.disabled = false; btn.textContent = 'Save update';
      }
    });
  });
}

async function loadDashboard(){
  if(isLoading) return;
  isLoading = true;
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.disabled = true;

  showDash();
  document.getElementById('adminNameLabel').textContent = session.adminName;
  try{
    const data = await fetchAdminData();
    if(!data.success){
      // credentials no longer valid — bounce back to login
      clearSession();
      session = null;
      showLogin();
      document.getElementById('loginError').textContent = data.error || 'Session expired, please log in again.';
      document.getElementById('loginError').style.display = 'block';
      return;
    }
    document.getElementById('totalReceived').textContent = fmt(data.totalReceived);
    renderTasks(data.tasks);
  }catch(err){
    document.getElementById('taskList').innerHTML = '<div class="empty-note">Couldn\u2019t load your data. Check your connection and tap Refresh.</div>';
  }finally{
    isLoading = false;
    refreshBtn.disabled = false;
  }
}

/* ---- boot ---- */
(function init(){
  const existing = loadSession();
  if(existing && existing.adminId && existing.password){
    session = existing;
    loadDashboard();
  }else{
    showLogin();
  }
})();
</script>
</body>
</html>
